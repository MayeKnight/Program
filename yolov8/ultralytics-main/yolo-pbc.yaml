# Train/val/test sets as 1) dir: path/to/imgs, 2) file: path/to/imgs.txt, or 3) list: [path/to/imgs1, path/to/imgs2, ..]
path: pbc # dataset root dir  
train: images/train # train images (relative to 'path') 118287 images
val: images/val # val images (relative to 'path') 5000 images
test: images/test # 20288 of 40670 images, submit to https://competitions.codalab.org/competitions/20794

# Classes   Basophills嗜碱性粒细胞  Eosinophills嗜酸性粒细胞   成红血细胞Erythroblast   B淋巴细胞Ig   单核细胞 Monocytes    巨核细胞Platelets   淋巴细胞lymphocytes   中性粒细胞neutrophils
names:
  0: Basophills
  1: Eosinophills
  2: Erythroblast
  3: Ig
  4: Monocytes
  5: Platelets
  6: lymphocytes
  7: neutrophils
